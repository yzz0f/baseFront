# Dependabot: actualizaciones semanales agrupadas por ecosistema.
# Las entradas comentadas con un prefijo `# lang:<x>:` las habilita
# ./scripts/bootstrap.sh --lang <x> cuando el repo tiene ese manifiesto.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

