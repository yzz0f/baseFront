# Ejecuta la misma verificación que scripts/check.sh: cada módulo de lenguaje
# detectado corre su formato, análisis estático y pruebas.
name: Verificación

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verificacion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Verificación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: scripts/check.sh
        run: ./scripts/check.sh
