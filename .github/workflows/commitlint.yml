# Valida que todos los commits del PR sigan Conventional Commits.
name: Commitlint

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  commitlint:
    name: Mensajes de commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
        with:
          configFile: commitlint.config.js
          helpURL: https://github.com/yzz0f/baseFront/blob/main/docs/lineamientos/02-commits.md
