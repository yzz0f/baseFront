name: Bug
description: Algo no funciona como debería
title: "fix: "
labels: [bug, triage]
body:
  - type: textarea
    id: descripcion
    attributes:
      label: Qué pasa
      description: Comportamiento actual, claro y breve.
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Qué esperabas
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
      placeholder: |
        1. Ir a...
        2. Ejecutar...
        3. Ver error...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión / commit / entorno
      placeholder: v2.3.1, main@abc123, staging
  - type: textarea
    id: logs
    attributes:
      label: Logs o capturas
      description: Sin datos personales ni secretos.
      render: shell
