# Hooks locales multi-lenguaje. Instalar con:
#   pre-commit install --hook-type pre-commit --hook-type commit-msg
# Cada hook sólo se ejecuta si hay archivos de su tipo en el commit.
minimum_pre_commit_version: '3.5.0'
default_stages: [pre-commit]

repos:
  # ---------- Genéricos ----------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main, --branch, master]

  # ---------- Secretos ----------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # ---------- Mensajes de commit ----------
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.18.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ['@commitlint/config-conventional@19']

  # ---------- JavaScript / TypeScript ----------
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types_or: [javascript, jsx, ts, tsx, json, yaml, markdown, css, scss, html]
        exclude: '(^|/)(package-lock\.json|pnpm-lock\.yaml|yarn\.lock)$'
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v9.15.0
    hooks:
      - id: eslint
        files: \.(js|jsx|mjs|cjs|ts|tsx)$
        types: [file]
        additional_dependencies:
          - eslint@9
          - typescript-eslint@8
          - '@eslint/js@9'

  # ---------- Python ----------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        args: [--ignore-missing-imports]

  # ---------- Go ----------
  - repo: https://github.com/golangci/golangci-lint
    rev: v1.62.0
    hooks:
      - id: golangci-lint

  # ---------- Shell ----------
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck

  # ---------- Dockerfiles ----------
  - repo: https://github.com/hadolint/hadolint
    rev: v2.13.1-beta
    hooks:
      - id: hadolint-docker

  # ---------- GitHub Actions ----------
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.4
    hooks:
      - id: actionlint

  # ---------- Java / Kotlin / C# ----------
  # Java y Kotlin se formatean con Spotless (plugin de Gradle/Maven) y C# con
  # `dotnet format`, ambos integrados en el build y en la CI. Ver templates/.
